# Local multi-process stack: api + coordinator + worker against PostgreSQL,
# plus Prometheus scraping the API's /metrics endpoint.
#
# The three DurableFlow processes share one image and differ only by command,
# which mirrors the real deployment shape: the API is stateless, and the
# coordinator and worker hold no required in-memory state.

name: durableflow

x-durableflow-env: &durableflow-env
  DURABLEFLOW_DATABASE_URL: postgresql+psycopg://durableflow:durableflow@postgres:5432/durableflow
  DURABLEFLOW_LOG_LEVEL: INFO
  DURABLEFLOW_LOG_JSON: "true"
  DURABLEFLOW_OTEL_SERVICE_NAME: durableflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: durableflow
      POSTGRES_PASSWORD: durableflow
      POSTGRES_DB: durableflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durableflow -d durableflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs alembic to head, then exits. Everything else waits for it to succeed,
  # so no process races an incomplete schema.
  migrate:
    build: .
    command: ["migrate"]
    environment: *durableflow-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["api"]
    environment: *durableflow-env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  coordinator:
    build: .
    command: ["coordinator", "--sweep-interval", "1"]
    environment: *durableflow-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["worker", "--concurrency", "4", "--lease-seconds", "10"]
    environment: *durableflow-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Scale with `docker compose up --scale worker=3`; claims are safe because
    # each is fenced by its own lease token.
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
