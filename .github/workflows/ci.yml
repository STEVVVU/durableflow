name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .

  # SQLite-only run: proves the suite needs no external services.
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v
      - name: Deterministic failure assertions (chaos)
        run: python -m durableflow.chaos

  # The same correctness assertions against the production backend, exercising
  # the SELECT ... FOR UPDATE SKIP LOCKED claim path.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: durableflow
          POSTGRES_PASSWORD: durableflow
          POSTGRES_DB: durableflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durableflow -d durableflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DURABLEFLOW_TEST_POSTGRES_URL: postgresql+psycopg://durableflow:durableflow@localhost:5432/durableflow
      DURABLEFLOW_DATABASE_URL: postgresql+psycopg://durableflow:durableflow@localhost:5432/durableflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Full suite including Postgres-marked tests
        run: python -m pytest -v
      - name: Chaos assertions against Postgres
        run: python -m durableflow.chaos --database "$DURABLEFLOW_TEST_POSTGRES_URL"

  # Smoke only: throughput from shared CI runners is not comparable across runs,
  # so this asserts the harness completes rather than checking a rate.
  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m durableflow.benchmark --jobs 500

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: durableflow:ci
      - name: Container starts and reports readiness
        run: |
          docker run -d --name durableflow-ci -p 8080:8080 durableflow:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then
              echo "readiness probe succeeded"
              exit 0
            fi
            sleep 2
          done
          echo "readiness probe never succeeded"
          docker logs durableflow-ci
          exit 1
