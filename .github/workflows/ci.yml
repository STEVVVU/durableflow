name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      # The default backend is SQLite, so this matrix needs no database service.
      - run: pytest
      - run: python -m durableflow.chaos

  # Exercises the PostgreSQL claim path (SELECT ... FOR UPDATE SKIP LOCKED),
  # which the SQLite matrix above skips. The database is provided by the GitHub
  # runner itself, so nothing is required of a developer machine.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: durableflow
          POSTGRES_PASSWORD: durableflow
          POSTGRES_DB: durableflow_test
        ports:
          - 5432:5432
        # Gate the job on readiness so pytest never races an unaccepting server.
        options: >-
          --health-cmd "pg_isready -U durableflow -d durableflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DURABLEFLOW_TEST_POSTGRES_URL: postgresql+psycopg://durableflow:durableflow@localhost:5432/durableflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Prove the alembic revisions apply to a real PostgreSQL server, not just
      # that create_all works.
      - run: durableflow --database "$DURABLEFLOW_TEST_POSTGRES_URL" migrate
      - run: pytest -m postgres
      - run: python -m durableflow.chaos --database "$DURABLEFLOW_TEST_POSTGRES_URL"

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m durableflow.benchmark
