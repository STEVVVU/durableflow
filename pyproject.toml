[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durableflow"
version = "0.1.0"
description = "A durable SQLite-backed job orchestration service"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "STEVVVU" }]
dependencies = []

[project.scripts]
durableflow = "durableflow.cli:main"

[tool.setuptools.packages.find]
include = ["durableflow*"]
